name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy PWA to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        run: flutter build web --release

      - name: Neuter legacy flutter_service_worker.js
        run: |
          cat << 'EOF' > build/web/flutter_service_worker.js
          // Flutter legacy service worker has been disabled in favor of sw.js.
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', () => self.clients.claim());
          EOF

      - name: Create Cloudflare Pages Project & Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Ensuring project '${{ secrets.CLOUDFLARE_PROJECT_NAME }}' exists on Cloudflare..."
          npx wrangler pages project create "${{ secrets.CLOUDFLARE_PROJECT_NAME }}" --production-branch="main" || true
          echo "Deploying build/web to Cloudflare Pages..."
          npx wrangler pages deploy build/web --project-name="${{ secrets.CLOUDFLARE_PROJECT_NAME }}" --branch="main" --commit-dirty=true
