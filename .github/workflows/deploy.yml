name: Deploy Flutter Web to Cloudflare Pages & GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy PWA to Cloudflare Pages & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(node -e "try { console.log(require('./web/version.json').version); } catch(e) { console.log('1.0.1'); }")
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "Extracted version: v$VERSION"

      - name: Build Flutter Web Release
        run: flutter build web --release

      - name: Neuter legacy flutter_service_worker.js
        run: |
          cat << 'EOF' > build/web/flutter_service_worker.js
          // Flutter legacy service worker has been disabled in favor of sw.js.
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', () => self.clients.claim());
          EOF

      - name: Verify Secret Config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          echo "Checking GitHub Secrets format..."
          echo "Account ID Length: ${#CLOUDFLARE_ACCOUNT_ID} characters"
          echo "API Token Length: ${#CLOUDFLARE_API_TOKEN} characters"
          echo "Project Name Length: ${#CLOUDFLARE_PROJECT_NAME} characters"
          if [ ${#CLOUDFLARE_ACCOUNT_ID} -ne 32 ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is usually exactly 32 characters long. Current length is ${#CLOUDFLARE_ACCOUNT_ID}."
          fi

      - name: Create Cloudflare Pages Project & Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Ensuring project '${{ secrets.CLOUDFLARE_PROJECT_NAME }}' exists on Cloudflare Pages..."
          npx wrangler pages project create "${{ secrets.CLOUDFLARE_PROJECT_NAME }}" --production-branch="main" || true
          echo "Deploying build/web to Cloudflare Pages..."
          npx wrangler pages deploy build/web --project-name="${{ secrets.CLOUDFLARE_PROJECT_NAME }}" --branch="main" --commit-dirty=true
          echo "================================================="
          echo "🚀 DEPLOY SUCCESSFUL!"
          echo "🌐 Your live Flutter Web App is available at:"
          echo "👉 https://${{ secrets.CLOUDFLARE_PROJECT_NAME }}.pages.dev"
          echo "================================================="

      - name: Create Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          body: "Bản cập nhật tự động cho OHT Control System (${{ env.APP_VERSION }})"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
